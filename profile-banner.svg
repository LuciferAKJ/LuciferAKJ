<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Aditya — software developer</title>
  <desc id="desc">A dark, terminal-inspired banner with a subtle grid, cyan accent lines, and the phrase building useful software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101827"/>
      <stop offset="1" stop-color="#0b1720"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70e1d1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#70e1d1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9b8cff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8aa3b8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#70e1d1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#70e1d1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="20" fill="url(#grid)"/>
  <circle cx="1010" cy="158" r="245" fill="url(#orb)"/>
  <path d="M0 270H1200" stroke="#70e1d1" stroke-opacity="0.18"/>
  <path d="M64 270H640" stroke="url(#glow)" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="66" y="58" fill="#70e1d1" font-size="13" letter-spacing="3">LUCIFERAKJ  /  ENGINEERING LOG</text>
    <text x="64" y="151" fill="#f3f7fb" font-size="58" font-weight="700" letter-spacing="-2">Hey, I'm Aditya.</text>
    <text x="68" y="198" fill="#b8c7d8" font-size="21">I build useful software, one system at a time.</text>
    <text x="68" y="242" fill="#70e1d1" font-size="13" letter-spacing="2">FULL-STACK  ·  BACKEND  ·  EXPERIMENTATION</text>
    <text x="1115" y="58" text-anchor="end" fill="#8494a8" font-size="12">SYS//001</text>
    <text x="1115" y="300" text-anchor="end" fill="#8494a8" font-size="11">BUILD  /  BREAK  /  LEARN</text>
  </g>
  <g transform="translate(905 105)" fill="none" stroke="#70e1d1" stroke-width="1.5" opacity="0.75">
    <rect x="0" y="0" width="205" height="128" rx="10" stroke-opacity="0.35"/>
    <path d="M16 24H189" stroke-opacity="0.3"/>
    <circle cx="18" cy="13" r="3" fill="#70e1d1" stroke="none"/>
    <circle cx="30" cy="13" r="3" fill="#9b8cff" stroke="none"/>
    <circle cx="42" cy="13" r="3" fill="#d5a76b" stroke="none"/>
    <path d="M22 53l10 8-10 8M42 69h35M22 88h70M22 105h48" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M110 52h72M110 69h52M110 88h62M110 105h36" stroke-opacity="0.5" stroke-linecap="round"/>
  </g>
</svg>
